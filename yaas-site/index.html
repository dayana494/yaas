<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DFC821" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DFC821'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23222'%3EY%3C/text%3E%3C/svg%3E" />
    <title>YAAS — Energy</title>
    <meta name="description" content="YAAS energy drink — pick your flavor." />
    <!-- Both self-hosted faces are preloaded. Without this, Bounded only starts
         downloading once the CSS has been parsed and something needs it, so it
         swaps in later than it has to; font-display: swap (styles/index.css)
         already means nothing is render-blocked on either of them. -->
    <link rel="preload" href="%BASE_URL%fonts/Soledago.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/Bounded-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The two @font-face rules live here rather than in styles/index.css, and
         for the same reason the preloads above do: %BASE_URL% is substituted at
         build time, so one source serves both the root deploy (Vercel) and the
         sub-path one (GitHub Pages).

         Vite does NOT rebase a root-absolute url() inside CSS, which is what
         made this necessary — styles/index.css had '/yaas/fonts/...' hardcoded
         to make the Pages build work, and that 404'd on every other origin
         including the dev server, so the real faces silently never loaded and
         everything fell back to Arial Narrow / Helvetica. A relative url()
         would be rebased, but these files are in public/ and so have no path
         to be relative to.

         font-display: swap, as before: nothing is render-blocked on either. -->
    <style>
      @font-face {
        font-family: 'Soledago';
        /* WOFF2 first (28.8 KiB, brotli-compressed) — same outlines as the
           original TTF (114.8 KiB), just repackaged; the .ttf stays in
           public/fonts/ purely as a format fallback for the handful of
           browsers that don't support WOFF2 (none of this project's actual
           targets), never fetched otherwise since the browser picks the
           first src it can use. */
        src:
          url('%BASE_URL%fonts/Soledago.woff2') format('woff2'),
          url('%BASE_URL%fonts/Soledago.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Replaces Beiruti site-wide — see --font-beiruti in styles/index.css.
         Name kept as 'Bounded' (not 'Beiruti') so it's obvious at a glance
         which family is actually loaded when reading font stacks elsewhere. */
      @font-face {
        font-family: 'Bounded';
        /* WOFF2 first (78.8 KiB vs the original .otf's 151 KiB) — same
           fallback reasoning as Soledago above. */
        src:
          url('%BASE_URL%fonts/Bounded-Medium.woff2') format('woff2'),
          url('%BASE_URL%fonts/Bounded-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      /* Same reasoning as the faces above, for the one image referenced from a
         CSS url() rather than from JS: a custom property can carry a
         base-resolved url() into any stylesheet, which %BASE_URL% cannot reach
         on its own. Used by .background-texture (styles/index.css) and
         .screen2-bg-texture (styles/screen2.css). Assets referenced from JS go
         through data/assetUrl.js instead and were never affected. */
      :root {
        --asset-bg-texture: url('%BASE_URL%textures/bg-texture.webp');
      }
    </style>
  </head>
  <body>
    <!-- First-load preloader (Figma 420:2). Plain markup + inline CSS/JS on
         purpose: it paints in the very first frame, before the bundle has even
         downloaded, and #root keeps rendering underneath it as usual.

         Sizes are Figma px at the 1920x980 frame divided by that frame's own
         hero scale (min(1860/1200, 980/650) = 1.5077), times --hero-scale — so
         they track the site's stage exactly: edge 50.6 -> 33.56, can 416.4 ->
         276.2, can pitch 360 -> 238.8, counter 30 -> 19.9.
         7.444 = advance width of "LOADING ENERGY" in Soledago per px of
         font-size (same idea as hero.css's 2.245 for "YAAS"). The line-heights
         put the ink edges on the box edges: .7575 is Soledago's cap top, .636
         Bounded's baseline, so both gaps read as exactly --pl-edge.
         Below 1024 it follows the 390x850 phone frame (429:70) instead: --u is
         one frame px, min'd against 100svh so the whole frame always fits above
         a phone's bottom address bar, centred vertically. Title 80/1.1 on two
         lines, can ink 319.4 tall at a 268.45 pitch, counter ink bottom 761.5.
         'Soledago PL' is the same preloaded file with font-display: block, so
         the title is first painted in its real face: a swap from the fallback
         moved its lines a few px (a layout shift) on slow connections.
         The cans in the marquee are WebP (quality 85, alpha kept at 100) rather
         than the PNGs they were captured as: same pixels to the eye at the
         ~151px they are drawn at, 67KB for the whole strip instead of 121KB,
         and this is the one image set that is on the critical path — it is the
         first thing the visitor sees. The .png files are still in
         public/images/preloader/ as the capture originals; nothing fetches
         them.

         React waits on window.__yaasPreloader.done before the hero entrance
         (HomePage) and calls .ready() once the hero scene has drawn a frame with
         its label textures (CanRig onReady). Other routes: fonts + window load.
         Either way the fade starts no later than 2s after navigation start. -->
    <style>
      @font-face{font-family:'Soledago PL';src:url('%BASE_URL%fonts/Soledago.woff2') format('woff2');font-display:block}
      #pl{--s:var(--hero-scale,1);--pl-edge:calc(33.56px*var(--s));position:fixed;inset:0;width:100vw;z-index:9999;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:var(--pl-edge) 0;box-sizing:border-box;overflow:hidden;container-type:inline-size;color:#fff;background:#f0907a url('%BASE_URL%images/gradient-still.webp') 50%/cover;transition:opacity .4s}
      #pl .t{font:400 calc((100vw - 2*var(--content-gutter,30px))/7.444)/.7575 'Soledago PL',Soledago,'Arial Narrow',sans-serif;font-size:calc((100cqw - 2*var(--content-gutter,30px))/7.444);text-transform:uppercase;white-space:nowrap;align-self:stretch;padding:0 var(--content-gutter,30px)}
      #pl-r{align-self:stretch}
      #pl-t{display:flex;width:max-content;animation:pl 30s linear infinite;will-change:transform}
      #pl-t img{height:calc(276.2px*var(--s));width:auto;margin-right:calc(87.6px*var(--s))}
      #pl-c{font:500 max(16px,calc(19.9px*var(--s)))/.636 Bounded,sans-serif;font-variant-numeric:tabular-nums;width:4em;height:.636em;text-align:center}
      #pl-c i{font-style:normal;display:inline-block;width:.78em;text-align:center}
      #pl .t br{display:none}
      @media (max-width:1023px){
        #pl{--u:min(calc(100vw/390),calc(100svh/850));justify-content:flex-start;padding:0}
        #pl .t{margin-top:calc((100svh - 850*var(--u))/2 + 80*var(--u));font-size:calc(80*var(--u));line-height:1.1;text-align:center;padding:0}
        #pl .t br{display:inline}
        #pl-r{margin-top:calc(80.3*var(--u))}
        #pl-t img{height:calc(319.4*var(--u));margin-right:calc(93.6*var(--u))}
        #pl-c{margin-top:calc(86.7*var(--u));font-size:calc(30*var(--u))}
      }
      @keyframes pl{to{transform:translate3d(-50%,0,0)}}
      @media (prefers-reduced-motion:reduce){#pl-t{animation:none}}
    </style>
    <div id="pl"><div class="t" aria-hidden="true">loading<br> energy</div><div id="pl-r" aria-hidden="true"><div id="pl-t"></div></div><div id="pl-c" role="status" aria-live="polite"><i>0</i>%</div></div>
    <script>
      (function(){var w=window,d=document,o=d.getElementById('pl'),c=d.getElementById('pl-c'),B='%BASE_URL%',
      s=Math.min((innerWidth-60)/1200,innerHeight/650),F=['lemon','blueberry','strawberry','orange','apple'],
      n=Math.ceil(2*innerWidth/(238.8*s)/5)*5,S=[15,27,38,45,57,76,90],ST=[],DU=[],q,x='',i,k,t=0,
      home=location.pathname.replace(/index\.html$/,'')==B,hr=0,fr=0,bg=0,ld=0,rt=0,v0=0,sh=0,res,
      EV=['wheel','touchmove','keydown'],now=function(){return performance.now()};
      d.documentElement.style.setProperty('--hero-scale',s);
      w.__yaasPreloader={done:new Promise(function(r){res=r}),ready:function(){hr=1;chk()}};
      for(i=0;i<2*n;i++){k=B+'images/preloader/'+F[i%5];x+='<img src="'+k+'.webp" srcset="'+k+'-sm.webp 98w,'+k+'.webp 196w" sizes="(max-width:1023px) 196px,'+Math.ceil(151.2*s)+'px" width="196" height="358" decoding="async" fetchpriority="low" alt="">'}
      d.getElementById('pl-t').innerHTML=x;
      for(i=0;i<7;i++){ST[i]=t;DU[i]=.9-.08*i;t+=1.7-.12*i}q=1500/(ST[6]+DU[6]);
      function pre(t){var v=0,i,p;for(i=0;i<7;i++){p=(t/q-ST[i])/DU[i];if(p<=0)break;v=(i?S[i-1]:0)+(S[i]-(i?S[i-1]:0))*Math.pow(2,10*Math.min(p,1)-10)}return v}
      function blk(e){if(e.type!='keydown'||/^(Arrow|Page|Home|End| )/.test(e.key)){e.preventDefault();e.stopImmediatePropagation()}}
      function chk(){if(fr&&(home?hr&&bg:ld))go()}
      function go(){if(!rt){rt=Math.max(now(),350);v0=pre(rt)}}
      function f(){var t=now(),p=rt&&t>=rt?Math.min(1,(t-rt)/250):-1,v=Math.floor(p<0?pre(t):v0+(100-v0)*(1-Math.pow(1-p,3)));
      if(v!=sh){sh=v;c.innerHTML=(''+v).replace(/\d/g,'<i>$&</i>')+'%'}
      if(p<1)return requestAnimationFrame(f);o.style.opacity=0;
      setTimeout(function(){o.remove();EV.forEach(function(e){w.removeEventListener(e,blk,true)});res()},400)}
      EV.forEach(function(e){w.addEventListener(e,blk,{passive:false,capture:true})});
      Promise.all([d.fonts.load('1em "Soledago PL"'),d.fonts.load('500 1em Bounded')]).then(function(){return d.fonts.ready}).then(function(){fr=1;chk()},function(){fr=1;chk()});
      k=new Image;k.onload=k.onerror=function(){bg=1;chk()};k.src=B+'images/gradient-still.webp';
      w.addEventListener('load',function(){ld=1;chk()});
      setTimeout(go,1700-now());requestAnimationFrame(f)})();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
