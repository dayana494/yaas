<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DFC821" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23DFC821'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='700' text-anchor='middle' fill='%23222'%3EY%3C/text%3E%3C/svg%3E" />
    <title>YAAS — Energy</title>
    <meta name="description" content="YAAS energy drink — pick your flavor." />
    <!-- Both self-hosted faces are preloaded. Without this, Bounded only starts
         downloading once the CSS has been parsed and something needs it, so it
         swaps in later than it has to; font-display: swap (styles/index.css)
         already means nothing is render-blocked on either of them. -->
    <link rel="preload" href="%BASE_URL%fonts/Soledago.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/Bounded-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The two @font-face rules live here rather than in styles/index.css, and
         for the same reason the preloads above do: %BASE_URL% is substituted at
         build time, so one source serves both the root deploy (Vercel) and the
         sub-path one (GitHub Pages).

         Vite does NOT rebase a root-absolute url() inside CSS, which is what
         made this necessary — styles/index.css had '/yaas/fonts/...' hardcoded
         to make the Pages build work, and that 404'd on every other origin
         including the dev server, so the real faces silently never loaded and
         everything fell back to Arial Narrow / Helvetica. A relative url()
         would be rebased, but these files are in public/ and so have no path
         to be relative to.

         font-display: swap, as before: nothing is render-blocked on either. -->
    <style>
      @font-face {
        font-family: 'Soledago';
        /* WOFF2 first (28.8 KiB, brotli-compressed) — same outlines as the
           original TTF (114.8 KiB), just repackaged; the .ttf stays in
           public/fonts/ purely as a format fallback for the handful of
           browsers that don't support WOFF2 (none of this project's actual
           targets), never fetched otherwise since the browser picks the
           first src it can use. */
        src:
          url('%BASE_URL%fonts/Soledago.woff2') format('woff2'),
          url('%BASE_URL%fonts/Soledago.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Replaces Beiruti site-wide — see --font-beiruti in styles/index.css.
         Name kept as 'Bounded' (not 'Beiruti') so it's obvious at a glance
         which family is actually loaded when reading font stacks elsewhere. */
      @font-face {
        font-family: 'Bounded';
        /* WOFF2 first (78.8 KiB vs the original .otf's 151 KiB) — same
           fallback reasoning as Soledago above. */
        src:
          url('%BASE_URL%fonts/Bounded-Medium.woff2') format('woff2'),
          url('%BASE_URL%fonts/Bounded-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      /* Same reasoning as the faces above, for the one image referenced from a
         CSS url() rather than from JS: a custom property can carry a
         base-resolved url() into any stylesheet, which %BASE_URL% cannot reach
         on its own. Used by .background-texture (styles/index.css) and
         .screen2-bg-texture (styles/screen2.css). Assets referenced from JS go
         through data/assetUrl.js instead and were never affected. */
      :root {
        --asset-bg-texture: url('%BASE_URL%textures/bg-texture.webp');
      }
      /* Hides the static LCP shell below at exactly the breakpoint
         HeroWordmark.jsx's own useMediaQuery('(max-width: 768px)') switches
         from this mobile banner treatment to the desktop giant wordmark —
         see the shell's own comment by #lcp-shell in <body>. */
      @media (min-width: 769px) {
        #lcp-shell {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- A static snapshot of the mobile hero's own LCP element (see
           HeroWordmark.jsx / Logo.jsx), painted before any JS has run.

           This app renders entirely client-side — nothing appears until the
           JS bundle downloads, parses and mounts React — and PageSpeed
           traced essentially all of the "YAAS" wordmark's LCP time to that
           wait, not to loading anything: Time to First Byte 0ms, ~2.3s of
           pure render delay. The CSS above is already render-blocking (it
           has to be, to style anything at all), so by the time the browser
           gets here it's ready to paint this immediately, without waiting
           for a single script.

           This isn't hydration: ReactDOM.createRoot(root).render(...)
           (main.jsx) unconditionally replaces #root's entire contents on
           mount rather than reconciling against what's already there, so
           this markup is simply discarded, whole, the moment React takes
           over — never diffed, never left behind. It only has to be right
           for the one paint before that happens, which is also why it can
           skip useFillWidth's own scaleX fit (three/HeroWordmark.jsx): that
           runs a frame after mount even in the real component, so the very
           first frame there is exactly this same unscaled state today.

           Classes match HeroWordmark.jsx/Logo.jsx exactly (.intro-pin,
           .hero-mobile-banner-logo-row, .logo-text) so this is styled by
           the same rules already loaded above, not a hand-tuned copy that
           can drift from them. Hidden above 768px by the rule beside it,
           matching the JS breakpoint that switches to the desktop wordmark
           instead — a desktop visitor never sees this. -->
      <!-- LCP-SHELL:START (see vite.config.js's staticRoutes — this exact
           block is stripped back out for every route but "/", since it's
           only ever a real match for the homepage's own mobile hero). -->
      <div id="lcp-shell" class="intro-pin">
        <div class="hero-mobile-banner-logo-row" aria-hidden="true">
          <span class="logo-text hero-mobile-banner-logo" aria-label="YAAS">YAAS</span>
        </div>
      </div>
      <!-- LCP-SHELL:END -->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
